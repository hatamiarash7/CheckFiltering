repos:
  - repo: local
    hooks:
      - id: black
        name: Black
        entry: poetry run black --check
        language: system
        types: [python]
      - id: isort
        name: isort
        entry: poetry run isort --check-only
        language: system
        types: [python]
      - id: ruff
        name: Ruff
        entry: poetry run ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: make type-check
        language: system
        pass_filenames: false
        types: [python]
